name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src app tests

      - name: Generate data and train model
        run: |
          mkdir -p data
          python -m src.simulator
          python -m src.train_final v1

      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov=app --cov-report=term-missing